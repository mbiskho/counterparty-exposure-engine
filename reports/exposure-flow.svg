<text x="82" y="616" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600">Meridian Markets / CSA-MM-01</text>
<rect x="360" y="605" width="540" height="13" rx="5" fill="#f1f5f9"/>
<rect x="360" y="605" width="335.13" height="13" rx="5" fill="#2563eb"><title>USD 102,400</title></rect>
<text x="1110" y="616" text-anchor="end" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">USD 102,400</text>
<text x="82" y="658" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600">Northstar Bank / ISDA-NS-02</text>
<rect x="360" y="647" width="540" height="13" rx="5" fill="#f1f5f9"/>
<rect x="360" y="647" width="310.91" height="13" rx="5" fill="#2563eb"><title>USD 95,000</title></rect>
<text x="1110" y="658" text-anchor="end" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">USD 95,000</text>
<text x="82" y="758" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="11">PFE = current exposure + illustrative notional-based add-on • Not a regulatory exposure calculation</text>
</svg>
