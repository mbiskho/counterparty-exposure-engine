<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="chart-title chart-description">
<title id="chart-title">Counterparty exposure workflow</title>
<desc id="chart-description">White workflow diagram from trade inputs through netting, collateral, exposure and limit monitoring, with current exposure chart by netting set.</desc>
<rect width="1200" height="820" fill="#ffffff"/>
<rect x="34" y="30" width="1132" height="760" rx="24" fill="#ffffff" stroke="#e5eaf1" stroke-width="2"/>
<text x="66" y="86" fill="#2563eb" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">HOW IT WORKS</text>
<text x="66" y="126" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">From trade ledger to counterparty exposure</text>
<text x="66" y="157" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="15">Netting, collateral haircuts and limit utilization stay visible at each step.</text>
<rect x="66" y="196" width="202" height="146" rx="16" fill="#f8fafc" stroke="#dbe4ef"/>
<circle cx="94" cy="227" r="15" fill="#dbeafe"/>
<text x="94" y="232" text-anchor="middle" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">01</text>
<text x="84" y="265" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Trades</text>
<text x="84" y="290" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">
<tspan x="84" dy="0">Counterparty</tspan>
<tspan x="84" dy="15">netting set, MTM</tspan>
<tspan x="84" dy="15">notional and PFE rate</tspan>
</text>
<path d="M273 269h12m-5 -5 5 5-5 5" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="290" y="196" width="202" height="146" rx="16" fill="#f8fafc" stroke="#dbe4ef"/>
<circle cx="318" cy="227" r="15" fill="#dbeafe"/>
<text x="318" y="232" text-anchor="middle" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">02</text>
<text x="308" y="265" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Net MTM</text>
<text x="308" y="290" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">
<tspan x="308" dy="0">Offset trade values</tspan>
<tspan x="308" dy="15">inside each legal</tspan>
<tspan x="308" dy="15">netting set only</tspan>
</text>
<path d="M497 269h12m-5 -5 5 5-5 5" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="514" y="196" width="202" height="146" rx="16" fill="#f8fafc" stroke="#dbe4ef"/>
<circle cx="542" cy="227" r="15" fill="#dbeafe"/>
<text x="542" y="232" text-anchor="middle" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">03</text>
<text x="532" y="265" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Collateral</text>
<text x="532" y="290" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">
<tspan x="532" dy="0">Apply haircut to</tspan>
<tspan x="532" dy="15">eligible collateral</tspan>
<tspan x="532" dy="15">value</tspan>
</text>
<path d="M721 269h12m-5 -5 5 5-5 5" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="738" y="196" width="202" height="146" rx="16" fill="#f8fafc" stroke="#dbe4ef"/>
<circle cx="766" cy="227" r="15" fill="#dbeafe"/>
<text x="766" y="232" text-anchor="middle" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">04</text>
<text x="756" y="265" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Exposure</text>
<text x="756" y="290" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">
<tspan x="756" dy="0">Floor net MTM less</tspan>
<tspan x="756" dy="15">collateral at zero</tspan>
</text>
<path d="M945 269h12m-5 -5 5 5-5 5" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="962" y="196" width="202" height="146" rx="16" fill="#f8fafc" stroke="#dbe4ef"/>
<circle cx="990" cy="227" r="15" fill="#dbeafe"/>
<text x="990" y="232" text-anchor="middle" fill="#1d4ed8" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700">05</text>
<text x="980" y="265" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">Monitor</text>
<text x="980" y="290" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">
<tspan x="980" dy="0">Add PFE estimate</tspan>
<tspan x="980" dy="15">and check limits</tspan>
</text>
<text x="66" y="398" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">Current exposure by netting set</text>
<text x="66" y="422" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="13">After eligible collateral • Within-set netting only</text>
<rect x="66" y="443" width="1068" height="326" rx="16" fill="#fbfdff" stroke="#e2e8f0"/>
<text x="82" y="472" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">COUNTERPARTY / NETTING SET</text>
<text x="360" y="472" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="11">CURRENT EXPOSURE</text>
<text x="82" y="532" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="600">Harbor Capital / CSA-HC-01</text>
