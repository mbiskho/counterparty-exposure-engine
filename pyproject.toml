[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counterparty-exposure-engine"
version = "0.1.0"
description = "Auditable counterparty current exposure, collateral, and PFE add-on analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
counterparty-exposure = "counterparty_exposure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
